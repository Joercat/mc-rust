# Render Blueprint for the web client (docs/WEB.md).
#
# This branch publishes `public/` as-is: the page, both engines and their glue
# are committed here. The resource pack is hundreds of megabytes, so it is not:
# the build downloads it from the URL in HORIZON_VFS_URL, which is set in the
# Render Dashboard (a release asset of this repository works).
#
# The two isolation headers are what make the page a cross-origin isolated
# secure context, which is what the threaded engine's shared memory needs.
# Without them the page still runs, single-threaded, on Render's HTTPS.
services:
  - type: web
    name: horizon-web
    runtime: static
    branch: threaded-wasm
    buildCommand: bash scripts/render_build.sh
    staticPublishPath: ./public
    envVars:
      - key: HORIZON_VFS_URL
        sync: false
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      # The page and its glue have no build stamp in their own path: the
      # engines' `?v=` stamp lives in `app.js`. A cached copy of these keeps a
      # player on an older engine after a deploy — including one whose bug is
      # fixed — so they are revalidated every load.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /app.js
        name: Cache-Control
        value: no-cache
      - path: /threads.js
        name: Cache-Control
        value: no-cache
      # The build manifest is what tells the page whether its stored copies are
      # still this build's; a cached copy of it would answer for the old one.
      - path: /assets.json
        name: Cache-Control
        value: no-cache
      - path: /asset-cache.js
        name: Cache-Control
        value: no-cache
      - path: /web-manifest
        name: Cache-Control
        value: no-cache
      # The pack is fetched once per browser, not once per load: the page keeps
      # it in IndexedDB under the hash in assets.json.
      - path: /horizon-vfs.bin
        name: Cache-Control
        value: no-cache
